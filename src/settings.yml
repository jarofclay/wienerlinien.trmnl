---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.7
serverless_language: node
refresh_interval_floor: ''
polling_url: "{% assign wl_list = wiener_linien_stops | split: \",\" %}{% assign wl_qs = \"\" %}{% for raw in wl_list %}{% assign sid = raw | strip %}{% if sid != \"\" %}{% if wl_qs != \"\" %}{% assign wl_qs = wl_qs | append: \"&\" %}{% endif %}{% if sid.size >= 7 %}{% assign wl_qs = wl_qs | append: \"diva=\" | append: sid %}{% else %}{% assign wl_qs = wl_qs | append: \"stopId=\" | append: sid %}{% endif %}{% endif %}{% endfor %}{% if wl_qs != \"\" %}https://www.wienerlinien.at/ogd_realtime/monitor?{{ wl_qs }}\r\n{% endif %}{% assign sb_list = sbahn_stops | split: \",\" %}{% for raw in sb_list %}{% assign eid = raw | strip %}{% if eid != \"\" %}https://fahrplan.oebb.at/bin/stboard.exe/dn?L=vs_scotty.vs_liveticker&tickerID=dep&start=yes&eqstops=no&evaId={{ eid }}&productsFilter=0000010000&showJourneys=30&boardType=dep&outputMode=tickerDataOnly\r\n{% endif %}{% endfor %}"
polling_headers: 'Accept: application/json, text/plain'
polling_body: ''
id: 552226
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: wiener_linien_stops
  field_type: string
  name: Wiener Linien Stops (DIVA or Stop IDs)
  description: Comma-separated 8-digit DIVA station IDs (returns ALL platforms & both directions for U-Bahn, Bus & Tram) or 1-5 digit RBL stop IDs for specific platforms.
  help_text: 'Examples: 4105, 4124, 693, 847 (Südtiroler Platz U1 both ways, 13A Kolschitzkygasse, 18/62 Hauptbahnhof) or DIVAs like 60201349 (Hauptbahnhof), 60201019 (Kolschitzkygasse), 60201040 (Praterstern).'
  default: 4105, 4124, 693, 847
- keyname: sbahn_stops
  field_type: string
  name: S-Bahn Stations (ÖBB EVA IDs)
  description: Optional comma-separated ÖBB station EVA IDs for real-time S-Bahn departures in both directions. Stations sharing the same name are merged automatically.
  help_text: 'Examples: 1290401 (Wien Hbf), 1290201 (Wien Praterstern). Leave empty if not needed. Run `npm run find-stop -- "Wien Mitte"` to look up any station EVA ID.'
  default: ''
- keyname: include_metro
  field_type: boolean
  name: Show U-Bahn (Metro)
  description: Include Vienna U-Bahn lines (U1-U6).
  default: true
- keyname: include_bus
  field_type: boolean
  name: Show Bus
  description: Include Wiener Linien city and night buses.
  default: true
- keyname: include_sbahn
  field_type: boolean
  name: Show S-Bahn
  description: Include ÖBB S-Bahn lines (S1-S80).
  default: true
- keyname: include_tram
  field_type: boolean
  name: Show Tram (Straßenbahn)
  description: Include Vienna tram / Straßenbahn lines (e.g. 18, 62, D, O).
  default: true
- keyname: line_filter
  field_type: string
  name: Filter Specific Lines (optional)
  description: Comma-separated line names to display (e.g. U1, 5B, 13A, S2, S7). Leave empty to show all lines at your selected stops.
  default: ''
- keyname: min_walk_minutes
  field_type: number
  name: Minimum Walk Time (minutes)
  description: Skip departures leaving sooner than this many minutes so the next two shown real times stay catchable between 5-minute e-ink refreshes.
  default: 1
- keyname: realtime_only
  field_type: boolean
  name: Real-Time Departures Only
  description: Only display live tracked departures (excludes scheduled-only timetable fallback).
  default: true
- keyname: time_display
  field_type: select
  name: Time Format
  description: Clock times (14:12 · 14:20) stay accurate on a 5-minute refresh screen; Countdown shows minutes from the last refresh.
  options:
  - clock
  - clock_and_min
  - minutes
  default: clock
- keyname: widget_title
  field_type: string
  name: Widget Title
  description: Header title shown in the TRMNL title bar.
  default: Vienna Transit
name: Vienna Transit Departures
description: Routes
refresh_interval: 15
