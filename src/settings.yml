---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.7
serverless_language: node
refresh_interval_floor: ''
polling_url: "{% assign wl_list = wiener_linien_stops | split: \",\" %}{% assign wl_qs = \"\" %}{% for raw in wl_list %}{% assign sid = raw | strip %}{% if sid != \"\" %}{% if wl_qs != \"\" %}{% assign wl_qs = wl_qs | append: \"&\" %}{% endif %}{% if sid.size >= 7 %}{% assign wl_qs = wl_qs | append: \"diva=\" | append: sid %}{% else %}{% assign wl_qs = wl_qs | append: \"stopId=\" | append: sid %}{% endif %}{% endif %}{% endfor %}{% if wl_qs != \"\" %}https://www.wienerlinien.at/ogd_realtime/monitor?{{ wl_qs }}\r\n{% endif %}{% assign sb_list = sbahn_stops | split: \",\" %}{% for raw in sb_list %}{% assign eid = raw | strip %}{% if eid != \"\" %}https://fahrplan.oebb.at/bin/stboard.exe/dn?L=vs_scotty.vs_liveticker&tickerID=dep&start=yes&eqstops=no&evaId={{ eid }}&productsFilter=0000010000&showJourneys=30&boardType=dep&outputMode=tickerDataOnly\r\n{% endif %}{% endfor %}"
polling_headers: 'Accept: application/json, text/plain'
polling_body: ''
id: 552226
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  name: Joe Swenson
  category: travel,life
  field_type: author_bio
  description: Making things for fun.
  github_url: https://github.com/jarofclay
  learn_more_url: https://montedia.com
  email_address: support@montedia.com
  youtube_url: https://www.youtube.com/@jarofclay/
- keyname: wiener_linien_stops
  field_type: string
  name: Wiener Linien Stops (DIVA or Stop IDs)
  description: Comma-separated 8-digit DIVA codes (both ways) or RBL stop IDs.
  help_text: 'Examples: 60201040 (Praterstern), 60200188 (Burggasse-Stadthalle).'
  default: '60201040'
  optional: true
- keyname: sbahn_stops
  field_type: string
  name: S-Bahn Stations (ÖBB EVA IDs)
  description: Optional comma-separated ÖBB EVA IDs for live S-Bahn departures.
  help_text: 'Examples: 1290201 (Wien Praterstern), 1290401 (Wien Hbf). Leave blank if unused.'
  default: ''
  optional: true
- keyname: include_metro
  field_type: boolean
  name: Show U-Bahn (Metro)
  description: Include Vienna U-Bahn lines (U1-U6).
  default: true
- keyname: include_bus
  field_type: boolean
  name: Show Bus
  description: Include Wiener Linien city and night buses.
  default: true
- keyname: include_sbahn
  field_type: boolean
  name: Show S-Bahn
  description: Include ÖBB S-Bahn lines (S1-S80).
  default: true
- keyname: include_tram
  field_type: boolean
  name: Show Tram (Straßenbahn)
  description: Include Vienna tram / Straßenbahn lines.
  default: true
- keyname: line_filter
  field_type: string
  name: Filter Specific Lines (optional)
  description: Comma-separated lines to keep (e.g. U1, 5B, 13A, S2). Blank shows all.
  default: ''
  optional: true
- keyname: min_walk_minutes
  field_type: number
  name: Minimum Walk Time (minutes)
  description: Skip departures leaving sooner than this many minutes.
  default: 1
  optional: true
- keyname: realtime_only
  field_type: boolean
  name: Real-Time Departures Only
  description: Hide scheduled-only timetable fallbacks.
  default: true
- keyname: time_display
  field_type: select
  name: Time Format
  description: Clock times (14:12) stay accurate between e-ink refreshes.
  options:
  - Clock (14:12): clock
  - Clock and minutes (14:12 (6′)): clock_and_min
  - Minutes only (6′): minutes
  default: clock
- keyname: times_per_route
  field_type: select
  name: Departures Per Route
  description: Times shown per line (2 for 5-min refresh, 3-4 for 15-min).
  options:
  - 2 departures (5-min refresh): '2'
  - 3 departures (15-min refresh): '3'
  - 4 departures (15-min refresh): '4'
  default: '2'
  optional: true
- keyname: widget_title
  field_type: string
  name: Widget Title
  description: Header title shown in the TRMNL title bar.
  default: Vienna Transit
  optional: true
name: Wiener Linien
description: Live Vienna transit departures
refresh_interval: 15
