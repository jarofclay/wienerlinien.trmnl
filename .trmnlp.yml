# Local development configuration for trmnlp (https://github.com/usetrmnl/trmnlp)
# Run `./bin/trmnlp serve` (requires Docker or trmnlp gem) or `node scripts/preview.mjs` (zero-dependency Node).
watch:
  - .trmnlp.yml
  - src

custom_fields:
  wiener_linien_stops: '60201040'
  sbahn_stops: '1290201,1290401'
  include_metro: true
  include_bus: true
  include_sbahn: true
  include_tram: false
  line_filter: ''
  min_walk_minutes: 1
  realtime_only: true
  time_display: clock
  widget_title: Vienna Transit

variables:
