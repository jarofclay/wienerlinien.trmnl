# Local development configuration for trmnlp (https://github.com/usetrmnl/trmnlp)
# Run `./bin/trmnlp serve` (requires Docker or trmnlp gem) or `npm run preview` (zero-dependency Node).
watch:
  - .trmnlp.yml
  - src

custom_fields:
  wiener_linien_stops: '60201040'
  sbahn_stops: '1290201,1290401'
  include_metro: true
  include_bus: true
  include_sbahn: true
  include_tram: true
  line_filter: ''
  min_walk_minutes: 1
  realtime_only: true
  time_display: clock
  times_per_route: '2'
  widget_title: Vienna Transit

variables:
  trmnl:
    plugin_settings:
      custom_fields_values:
        wiener_linien_stops: '60201040'
        sbahn_stops: '1290201,1290401'
        include_metro: true
        include_bus: true
        include_sbahn: true
        include_tram: true
        line_filter: ''
        min_walk_minutes: 1
        realtime_only: true
        time_display: clock
        times_per_route: '2'
        widget_title: Vienna Transit
  title: Vienna Transit
  updated: '14:08'
  time_display: clock
  times_per_route: 2
  rt_only: true
  stop_count: 2
  route_count: 10
  empty_message: null
  stops:
    - name: Praterstern
      col: L
      routes:
        - mode: metro
          line: U1
          to: Alaudagasse
          ts: [{ t: '14:11', m: 3 }, { t: '14:15', m: 7 }]
